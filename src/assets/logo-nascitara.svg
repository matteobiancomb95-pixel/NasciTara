<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 48" width="208" height="48"
     role="img" aria-labelledby="nascitara-title nascitara-desc">
  <title id="nascitara-title">NasciTara</title>
  <desc id="nascitara-desc">Una curva di crescita che sale sopra una culla arrotondata.</desc>

  <!-- La culla: arco morbido che regge la curva. Accento #FFC8B0. -->
  <path d="M7 30.5 Q 21.5 41.5 37.5 28"
        fill="none" stroke="#FFC8B0" stroke-width="5.5" stroke-linecap="round" />

  <!-- La curva di crescita: piatta all'inizio, poi sale. Principale #E2725B. -->
  <path d="M10 26.5 C 18 26.5 23 23.5 26.5 16.5 C 28.8 12 30.6 9.4 32.2 7.8"
        fill="none" stroke="#E2725B" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="33" cy="7" r="3.2" fill="#E2725B" />

  <!-- Wordmark. WCAG 1.4.3 esenta i logotipi dal requisito di contrasto. -->
  <text x="58" y="32" fill="#E2725B"
        font-family="'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="25" font-weight="700" letter-spacing="-0.4">NasciTara</text>
</svg>
