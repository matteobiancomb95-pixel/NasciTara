[functions.send-screening]
# JWT is verified inside the function via auth.getUser; supports current signing keys.
verify_jwt = false

# Account di produzione (applicato il 2026-09-27). `supabase config push` invia solo le voci dichiarate qui.
[auth]
# Dominio principale acquistato su Register.it e collegato a Vercel.
site_url = "https://nascitara.tech"
additional_redirect_urls = [
  "https://nascitara.vercel.app/",
  "https://nascitara.tech/",
  "https://www.nascitara.tech/",
  "http://127.0.0.1:5173/",
  "http://localhost:5173/",
]

[auth.email.template.confirmation]
subject = "Conferma il tuo account NasciTara"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Scegli una nuova password per NasciTara"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Conferma il nuovo indirizzo email su NasciTara"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Il tuo link di accesso a NasciTara"
content_path = "./supabase/templates/magic_link.html"

[functions.send-welcome]
# Verified inside the function with auth.getUser, then a service-only delivery reservation.
verify_jwt = false

# 0.7: tutte verificano il token dentro la funzione (auth.getUser) o, per il job, il segreto x-cron-secret.
[functions.ai]
verify_jwt = false

[functions.submit-feedback]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false
